services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${VOWBOOK_BASE_PATH:-}
    image: vowbook:local
    container_name: vowbook-app
    cpus: 2.0
    init: true
    mem_limit: 1g
    pids_limit: 128
    restart: unless-stopped
    env_file:
      - path: .env.admin
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${VOWBOOK_DATABASE_URL:?請在 .env 設定 URL-encoded 的 VOWBOOK_DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?請在 .env 設定 GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?請在 .env 設定 GOOGLE_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?請在 .env 設定 AUTH_SECRET}
      NEXT_PUBLIC_BASE_PATH: ${VOWBOOK_BASE_PATH:-}
      NEXTAUTH_URL: ${VOWBOOK_NEXTAUTH_URL:?請在 .env 設定 VOWBOOK_NEXTAUTH_URL}
      NEXTAUTH_URL_INTERNAL: http://127.0.0.1:3000${VOWBOOK_BASE_PATH:-}/api/auth
    ports:
      - "127.0.0.1:${VOWBOOK_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:3000${VOWBOOK_BASE_PATH:-}/api/health\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?請在 .env 設定 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?請在 .env 設定 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vowbook_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    image: vowbook-migrate:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${VOWBOOK_DATABASE_URL:?請在 .env 設定 URL-encoded 的 VOWBOOK_DATABASE_URL}

volumes:
  vowbook_postgres_data:
